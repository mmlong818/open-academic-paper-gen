services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papergen}
      POSTGRES_USER: ${POSTGRES_USER:-papergen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papergen_dev}
    ports:
      - "127.0.0.1:5558:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papergen}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev}
    ports:
      - "127.0.0.1:6400:6379"

volumes:
  postgres_data:
